<section class="whatsapp-chat-shell">
  <aside class="whatsapp-contacts">
    <div class="whatsapp-contacts-header">
      <h3>Chats</h3>
      <span>+</span>
    </div>
    <div class="contact-item active">
      <div class="avatar">A</div>
      <div>
        <strong>Alex Morgan</strong>
        <p>Let's review the updates</p>
      </div>
    </div>
    <div class="contact-item">
      <div class="avatar">M</div>
      <div>
        <strong>Mina Ali</strong>
        <p>Design notes are ready</p>
      </div>
    </div>
    <div class="contact-item">
      <div class="avatar">S</div>
      <div>
        <strong>Samir</strong>
        <p>Video uploaded</p>
      </div>
    </div>
  </aside>

  <main class="whatsapp-conversation">
    <div class="whatsapp-conversation-header">
      <div class="whatsapp-title">
        <div class="avatar">A</div>
        <div>
          <h3>Alex Morgan</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="whatsapp-actions">📞 📹</div>
    </div>

    <div class="messages-body">
      <div class="bubble incoming">Hi! I reviewed the new AQORA layout.</div>
      <div class="bubble outgoing">Looks great. I like the chat-inspired feel.</div>
      <div class="bubble incoming">Perfect. I can help you polish the next version.</div>
    </div>

    <div class="message-input-bar">
      <input type="text" placeholder="Type a message" />
      <button>Send</button>
    </div>
  </main>
</section>
