<div class="auth-container">
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="brand-logo">A</div>
      <h1>AQORA</h1>
      <p>Connect. Create. Discover.</p>
    </div>

    <form id="login-form" class="auth-form">
      <div id="auth-error" class="alert alert-danger hidden" style="display: none;">
        <div class="alert-icon">⚠</div>
        <div class="alert-content"></div>
      </div>

      <div id="auth-info" class="alert alert-success hidden" style="display: none;">
        <div class="alert-icon">✓</div>
        <div class="alert-content"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="button button-primary" style="width: 100%;">Sign In</button>
    </form>

    <div class="auth-divider">or</div>

    <button id="google-login" type="button" class="button button-ghost" style="width: 100%;">
      <span>🔍</span> Continue with Google
    </button>

    <div class="auth-links">
      <p>Don't have an account? <button type="button" class="button button-link" data-route="register" onclick="event.preventDefault(); renderRoute('register')">Create account</button></p>
      <p><button type="button" class="button button-link" data-route="forgot" onclick="event.preventDefault(); renderRoute('forgot')">Forgot password?</button></p>
    </div>
  </div>
</div>
