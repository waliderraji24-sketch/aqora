<div class="auth-container">
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="brand-logo">A</div>
      <h1>Join AQORA</h1>
      <p>Start your creative journey today</p>
    </div>

    <form id="register-form" class="auth-form">
      <div id="auth-error" class="alert alert-danger hidden" style="display: none;">
        <div class="alert-icon">⚠</div>
        <div class="alert-content"></div>
      </div>

      <div id="auth-info" class="alert alert-success hidden" style="display: none;">
        <div class="alert-icon">✓</div>
        <div class="alert-content"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="creative_mind" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="At least 8 characters" minlength="8" required>
        <p class="form-helper">Minimum 8 characters, mix of letters and numbers recommended</p>
      </div>

      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" required style="width: 16px; height: 16px;">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">I agree to the <button type="button" class="button button-link" style="padding: 0; font-size: inherit;" onclick="event.preventDefault()">Terms of Service</button> and <button type="button" class="button button-link" style="padding: 0; font-size: inherit;" onclick="event.preventDefault()">Privacy Policy</button></span>
      </label>

      <button type="submit" class="button button-primary" style="width: 100%;">Create Account</button>
    </form>

    <div class="auth-divider">or</div>

    <button id="google-register" type="button" class="button button-ghost" style="width: 100%;">
      <span>🔍</span> Sign up with Google
    </button>

    <div class="auth-links">
      <p>Already have an account? <button type="button" class="button button-link" data-route="login" onclick="event.preventDefault(); renderRoute('login')">Sign in</button></p>
    </div>
  </div>
</div>
